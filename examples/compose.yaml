services:
  mailpit:
    image: axllent/mailpit:v1.31.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    volumes:
      - mailpit-data:/data
    environment:
      MP_DATABASE: /data/mailpit.db

  graphapi:
    build: ..
    restart: unless-stopped
    depends_on:
      - mailpit
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      MAILPIT_GRAPH_TOKEN: change-me

volumes:
  mailpit-data:
